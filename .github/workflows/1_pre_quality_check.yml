name: pre-quality-check

# os dois gates que autorizam merge e release, na ordem: qualidade estatica
# (typos/fmt/clippy/audit/cobertura/sonar) e depois o e2e. moram no mesmo
# workflow_call pra que o 10_ci_before_merge e o 11_crates_publish nao possam
# divergir na sequencia — antes cada caller declarava a propria cadeia de `needs`.
# o equivalente do lado da imagem e o 3_image_quality_check.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  pre_build_quality_check:
    name: pre-build-quality-check
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: typos check
        uses: crate-ci/typos@d43b6c087ac471e2ea7b8af622ff15f05c0c365b

      - name: setup rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: install cargo-audit
        uses: taiki-e/install-action@5626e41434f03ab3022d9685405c0645c879f441

      - name: install cargo-llvm-cov
        uses: taiki-e/install-action@5626e41434f03ab3022d9685405c0645c879f441
        with:
          tool: cargo-llvm-cov

      - name: cargo fmt check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo audit
        run: cargo audit

      - name: cargo test with coverage
        run: cargo llvm-cov --all-targets --lcov --output-path lcov.info

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true

  # o e2e compila em --release e leva ate 30 min; roda so depois que typos/fmt/
  # clippy/audit passaram, pra nao queimar runner num commit que ja falhou barato.
  e2e:
    name: e2e
    needs: pre_build_quality_check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: -C target-cpu=x86-64-v2
      CARGO_TERM_COLOR: always
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30

      - name: cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: e2e-release

      - name: cargo test e2e
        run: cargo test --release --test '*' -- --ignored --nocapture

      - name: upload the e2e workspace on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-workspace
          path: |
            target/tmp/*/build.stdout
            target/tmp/*/build.stderr
            target/tmp/*/server-*.stderr
          if-no-files-found: ignore
          retention-days: 3
