name: image-quality-check

on:
  workflow_call:
    inputs:
      image:
        description: docker image tag to run the checks against
        required: true
        type: string
      version:
        description: release version to validate against `geolite --version`; empty skips the check
        required: false
        default: ''
        type: string
      artifact:
        description: optional artifact name with a `docker save` tarball to load before checking
        required: false
        default: ''
        type: string
      runner:
        description: runner to execute the checks on (use the image's native arch)
        required: false
        default: ubuntu-latest
        type: string
  workflow_dispatch:
    inputs:
      image:
        description: 'docker image tag (e.g. pjpimentel/geolite:latest)'
        required: true
        type: string
      version:
        description: 'expected version to validate against `geolite --version` (empty skips the check)'
        required: false
        default: ''
        type: string

jobs:
  quality_check:
    name: image quality check
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    permissions:
      contents: read
    env:
      IMAGE: ${{ inputs.image }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: download image artifact
        if: inputs.artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: image
      - name: load image
        if: inputs.artifact != ''
        run: docker load -i image/image.tar
      - name: pull image
        if: inputs.artifact == ''
        run: docker pull "$IMAGE"

      - name: 0, validate --version matches release version
        if: inputs.version != ''
        run: |
          actual=$(docker run --rm "$IMAGE" --version | awk '{print $NF}')
          echo "expected=$VERSION actual=$actual"
          if [ "$VERSION" != "$actual" ]; then
            echo "::error::version mismatch (release=$VERSION, image=$actual)"
            exit 1
          fi

      - name: 1, ensure image under 20mb
        run: |
          limit=$((20 * 1024 * 1024))
          size=$(docker image inspect "$IMAGE" --format '{{.Size}}')
          echo "image size: $((size / 1024 / 1024)) MiB ($size bytes), limit: $((limit / 1024 / 1024)) MiB"
          if [ "$size" -ge "$limit" ]; then
            echo "::error::image $IMAGE is $((size / 1024 / 1024)) MiB, exceeds 20 MiB limit"
            exit 1
          fi

      - name: 2, validate build maldives
        run: docker run --rm "$IMAGE" build maldives
