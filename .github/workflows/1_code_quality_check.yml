name: code_quality_check

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTFLAGS: -C target-cpu=x86-64-v2
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1

      - name: typos check
        uses: crate-ci/typos@2611abd15acb0c2e317fb9e45855aabb8b35a414

      - name: setup rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt, clippy

      - name: install cargo-audit
        uses: taiki-e/install-action@5626e41434f03ab3022d9685405c0645c879f441

      - name: cargo fmt check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo audit
        run: cargo audit

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: setup rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: llvm-tools-preview

      - name: install cargo-llvm-cov
        uses: taiki-e/install-action@5626e41434f03ab3022d9685405c0645c879f441
        with:
          tool: cargo-llvm-cov

      - name: cargo test e2e with coverage
        run: cargo llvm-cov --profile e2e --no-report --test '*' -- --ignored --nocapture

      - name: lcov report
        run: cargo llvm-cov report --profile e2e --lcov --output-path lcov.info

      - name: build maldives
        run: ./target/llvm-cov-target/e2e/geolite build maldives

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true

      - name: upload the e2e workspace on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-workspace
          path: |
            target/llvm-cov-target/tmp/*/build.stdout
            target/llvm-cov-target/tmp/*/build.stderr
            target/llvm-cov-target/tmp/*/server-*.stderr
          if-no-files-found: ignore
          retention-days: 3
