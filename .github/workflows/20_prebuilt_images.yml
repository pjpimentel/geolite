name: prebuilt images

on:
  workflow_dispatch:
    inputs:
      version:
        description: tag of the base binary image (pjpimentel/geolite:<version>)
        required: false
        default: latest
        type: string
      region:
        description: region to build, a continent or a country of the geofabrik index
        required: true
        type: choice
        options:
          - south-america
          - portugal
          - netherlands
          - switzerland
  schedule:
    - cron: '0 6 1,15 * *'

permissions:
  contents: read

jobs:
  setup:
    name: resolve matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      regions: ${{ steps.matrix.outputs.regions }}
      version: ${{ steps.matrix.outputs.version }}
    steps:
      - name: resolve regions and version
        id: matrix
        env:
          REGION: ${{ inputs.region }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$REGION" ]; then
            echo "regions=[\"$REGION\"]" >> "$GITHUB_OUTPUT"
          else
            echo 'regions=["south-america","portugal","netherlands","switzerland"]' >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VERSION:-latest}" >> "$GITHUB_OUTPUT"

  build:
    name: prebuilt ${{ matrix.region }}
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: prebuilt-${{ matrix.region }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        region: ${{ fromJSON(needs.setup.outputs.regions) }}
    env:
      VERSION: ${{ needs.setup.outputs.version }}
      REGION: ${{ matrix.region }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0

      - name: increase swap space
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile || true
          sudo fallocate -l 30G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: setup buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: login to docker hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: pjpimentel
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: inject region into dockerfile
        run: |
          test -n "$REGION" || { echo "::error::REGION is empty"; exit 1; }
          sed "s/__REGION__/$REGION/" Dockerfile.prebuilt > Dockerfile.prebuilt.generated

      - name: buildx multi-arch build and push
        run: |
          TS=$(date -u +%Y%m%d%H%M)
          docker buildx build \
            --file Dockerfile.prebuilt.generated \
            --build-arg VERSION="$VERSION" \
            --platform linux/amd64,linux/arm64 \
            --tag "pjpimentel/geolite:prebuilt-$REGION" \
            --tag "pjpimentel/geolite:prebuilt-$REGION-$TS" \
            --push .
